<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bg-auth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <!-- 盾牌金屬漸層 -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- 金色邊框漸層 -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- 正版綠勾漸層 -->
    <linearGradient id="mojang-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <!-- 柔和陰影 -->
    <filter id="shadow-auth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 圓角背景與外框 -->
  <rect width="128" height="128" rx="28" fill="url(#bg-auth)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2"/>

  <!-- 背景科技光環裝飾 -->
  <circle cx="64" cy="62" r="42" fill="none" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- 安全盾牌主體 -->
  <g filter="url(#shadow-auth)">
    <!-- 盾牌外廓 (金色光邊) -->
    <path d="M64 22 L88 32 C88 56 78 76 64 86 C50 76 40 56 40 32 Z" 
          fill="url(#shield-grad)" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Minecraft 像素頭像 / 角色剪影 (在盾牌中央) -->
    <!-- 頭部方塊 -->
    <rect x="54" y="38" width="20" height="20" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <!-- 眼睛與表情 -->
    <rect x="57" y="47" width="4" height="3" fill="#2563eb"/>
    <rect x="67" y="47" width="4" height="3" fill="#2563eb"/>
    <rect x="61" y="52" width="6" height="2" fill="#94a3b8"/>
    <!-- 身體方塊 -->
    <path d="M50 63 C50 60 56 59 64 59 C72 59 78 60 78 63 L74 72 C68 76 60 76 54 72 Z" fill="#e2e8f0"/>
  </g>

  <!-- 左側：Mojang 正版認證標章 (Verified Badge) -->
  <g filter="url(#shadow-auth)">
    <circle cx="34" cy="74" r="13" fill="url(#mojang-green)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- 綠勾勾 -->
    <path d="M28 74 L32 78 L40 69" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右側：離線/外置密碼登入 (Key / Lock Badge) -->
  <g filter="url(#shadow-auth)">
    <circle cx="94" cy="74" r="13" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- 鑰匙圖標 -->
    <circle cx="91" cy="71" r="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M94 74 L100 80 M97 77 L99 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 底部：同步連動雙向循環箭頭 (Sync Skin / Account) -->
  <g filter="url(#shadow-auth)">
    <path d="M46 100 C51 96 57 95 64 95 C71 95 77 97 82 101" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <polyline points="77,101 83,101 83,95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 107 C77 111 71 112 64 112 C57 112 51 110 46 106" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <polyline points="51,106 45,106 45,112" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
