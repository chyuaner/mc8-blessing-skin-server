<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-tgimg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#1bb76e"/>
    </linearGradient>
    <filter id="shadow-tg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-tgimg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Photo / Image Frame -->
  <g filter="url(#shadow-tg)">
    <rect x="24" y="36" width="60" height="54" rx="8" fill="#ffffff"/>
    <rect x="28" y="40" width="52" height="38" rx="4" fill="#0f172a"/>
    <!-- Photo inside: Sun & Mountain -->
    <circle cx="40" cy="50" r="4.5" fill="#facc15"/>
    <polygon points="32,74 46,58 56,70 66,54 78,74" fill="#10b981"/>
    <!-- Image placeholder line in polaroid bottom -->
    <rect x="36" y="82" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Telegram Paper Airplane Circle Badge -->
  <g filter="url(#shadow-tg)">
    <circle cx="88" cy="74" r="24" fill="#ffffff"/>
    <circle cx="88" cy="74" r="21" fill="#0088cc"/>
    <!-- Paper Airplane -->
    <path d="M78 73 L98 64 L93 84 L87 77 L83 80 L83 75 Z" fill="#ffffff"/>
    <path d="M87 77 L95 68 L82 74 Z" fill="#e2e8f0"/>
  </g>
</svg>
