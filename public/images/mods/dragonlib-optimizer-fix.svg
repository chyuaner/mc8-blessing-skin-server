<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-dragon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="crystal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow-drag" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-dragon)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- 3D Model Wireframe Mesh (Dynamic Model Baking) -->
  <g opacity="0.35">
    <polygon points="64,24 100,44 64,64 28,44" fill="none" stroke="#e0e7ff" stroke-width="2"/>
    <polygon points="28,44 64,64 64,104 28,84" fill="none" stroke="#e0e7ff" stroke-width="2"/>
    <polygon points="64,64 100,44 100,84 64,104" fill="none" stroke="#e0e7ff" stroke-width="2"/>
    <line x1="64" y1="24" x2="64" y2="64" stroke="#e0e7ff" stroke-width="2"/>
  </g>

  <!-- Dragon Head / Wing Silhouette -->
  <path d="M42 42 L64 26 L86 42 L76 56 L88 72 L64 62 L40 72 L52 56 Z" 
        fill="url(#crystal-grad)" filter="url(#shadow-drag)"/>

  <!-- Optimization / Fix Gear Symbol -->
  <g filter="url(#shadow-drag)">
    <circle cx="86" cy="84" r="18" fill="#10b981"/>
    <!-- Gear teeth or Rocket check -->
    <path d="M78 84 L84 90 L95 78" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
