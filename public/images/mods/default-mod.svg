<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-default-mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="gear-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-default-mod)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Isometric Minecraft Mod Block / Cube Group -->
  <g filter="url(#shadow)" transform="translate(0, 2)">
    <!-- Top Face -->
    <polygon points="64,28 96,44 64,60 32,44" fill="url(#cube-top)"/>
    <!-- Left Face -->
    <polygon points="32,44 64,60 64,96 32,80" fill="url(#cube-left)"/>
    <!-- Right Face -->
    <polygon points="64,60 96,44 96,80 64,96" fill="url(#cube-right)"/>

    <!-- Inner Cube Circuit / Mod Core Grid -->
    <line x1="64" y1="28" x2="64" y2="60" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <line x1="32" y1="44" x2="96" y2="44" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Wrench / Gear Floating Badge (Bottom Right) -->
    <circle cx="86" cy="86" r="15" fill="#0EA5E9" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- Cog / Gear Icon inside Badge -->
    <g transform="translate(86, 86) scale(0.65)" fill="#FFFFFF">
      <path d="M-4,-12 L4,-12 L5,-7 L10,-5 L14,-9 L18,-5 L15,0 L16,6 L21,8 L20,13 L15,13 L13,18 L16,22 L12,25 L8,21 L3,22 L2,27 L-4,27 L-4,22 L-9,21 L-13,25 L-17,21 L-14,17 L-15,11 L-20,9 L-19,4 L-14,3 L-13,-2 L-17,-6 L-13,-10 L-9,-7 L-4,-8 Z" />
      <circle cx="0" cy="7" r="4.5" fill="#0EA5E9"/>
    </g>
  </g>
</svg>
