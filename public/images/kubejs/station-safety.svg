<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-station" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bounce-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shield-station" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow-station" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
    <pattern id="hazard-pattern" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#fbbf24" stroke-width="8" />
      <line x1="8" y1="0" x2="8" y2="16" stroke="#1f2937" stroke-width="8" />
    </pattern>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-station)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Station Platform Surface (Left & Top) -->
  <g filter="url(#shadow-station)">
    <!-- Platform Body -->
    <path d="M 16 28 H 68 V 104 H 16 Z" fill="#475569"/>
    <!-- Platform Warning Hazard Edge -->
    <rect x="68" y="28" width="14" height="76" fill="url(#hazard-pattern)" stroke="#334155" stroke-width="1"/>
    <!-- Track Abyss / Dropoff (Right) -->
    <rect x="82" y="44" width="30" height="60" fill="#0f172a" opacity="0.6"/>
    <!-- Lower Track Rails -->
    <line x1="90" y1="44" x2="90" y2="104" stroke="#64748b" stroke-width="3"/>
    <line x1="104" y1="44" x2="104" y2="104" stroke="#64748b" stroke-width="3"/>
    <!-- Sleepers -->
    <line x1="86" y1="60" x2="108" y2="60" stroke="#78350f" stroke-width="2.5"/>
    <line x1="86" y1="80" x2="108" y2="80" stroke="#78350f" stroke-width="2.5"/>
    <line x1="86" y1="100" x2="108" y2="100" stroke="#78350f" stroke-width="2.5"/>
  </g>

  <!-- Repulsion / Bounce Forcefield Arrows (Pushing Left toward platform) -->
  <g filter="url(#shadow-station)">
    <!-- Push Arrow 1 -->
    <path d="M 72 50 L 52 50 M 58 44 L 52 50 L 58 56" fill="none" stroke="url(#bounce-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Push Arrow 2 -->
    <path d="M 76 72 L 46 72 M 54 64 L 46 72 L 54 80" fill="none" stroke="url(#bounce-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Force Ripple Arcs -->
    <path d="M 78 40 Q 64 66 78 92" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Safety Star / Shield Indicator -->
  <g filter="url(#shadow-station)">
    <circle cx="36" cy="42" r="14" fill="url(#shield-station)"/>
    <path d="M 36 34 L 38.5 39.5 L 44 40.5 L 40 44.5 L 41 50 L 36 47 L 31 50 L 32 44.5 L 28 40.5 L 33.5 39.5 Z" fill="#ffffff"/>
  </g>
</svg>
