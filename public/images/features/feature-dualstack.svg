<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bg-ds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <!-- 地球經緯漸層 -->
    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- IPv4 綠色徽章 -->
    <linearGradient id="ipv4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- IPv6 紫藍色徽章 -->
    <linearGradient id="ipv6-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- 柔和陰影 -->
    <filter id="shadow-ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 圓角背景與外框 -->
  <rect width="128" height="128" rx="28" fill="url(#bg-ds)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2"/>

  <!-- 背景科技光環裝飾 -->
  <circle cx="64" cy="56" r="38" fill="none" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- 地球主體與經緯線 -->
  <g filter="url(#shadow-ds)">
    <circle cx="64" cy="54" r="26" fill="url(#globe-grad)" opacity="0.3"/>
    <circle cx="64" cy="54" r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- 經線 -->
    <ellipse cx="64" cy="54" rx="14" ry="26" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <ellipse cx="64" cy="54" rx="26" ry="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
    <line x1="64" y1="28" x2="64" y2="80" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
  </g>

  <!-- 雙棧雙線路發光光軌 (分流至下方兩枚晶片) -->
  <g>
    <!-- IPv4 線路軌道 (左) -->
    <path d="M50 72 C42 78 38 82 38 92" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <!-- IPv6 線路軌道 (右) -->
    <path d="M78 72 C86 78 90 82 90 92" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 網路節點光斑 -->
    <circle cx="50" cy="72" r="3" fill="#34d399"/>
    <circle cx="78" cy="72" r="3" fill="#818cf8"/>
  </g>

  <!-- 底部雙線路徽章 (IPv4 + IPv6) -->
  <g filter="url(#shadow-ds)">
    <!-- IPv4 Badge -->
    <rect x="24" y="92" width="36" height="18" rx="5" fill="url(#ipv4-grad)"/>
    <text x="42" y="104.5" font-family="'Consolas', monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">IPv4</text>
    
    <!-- IPv6 Badge -->
    <rect x="68" y="92" width="36" height="18" rx="5" fill="url(#ipv6-grad)"/>
    <text x="86" y="104.5" font-family="'Consolas', monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">IPv6</text>
  </g>
</svg>
